<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US-031 Connect Four — wood board and glossy pieces</title>
<style>
  :root {
    --piece-red: #d94040;
    --piece-yellow: #d97706;
    --foreground: #3d2e1e;
  }
  body {
    margin: 0;
    padding: 16px;
    background: #faf5eb;
    color: var(--foreground);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 0;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    color: #7a4006;
  }
  .disc-board {
    border: 2px solid var(--foreground);
    border-radius: 12px;
    padding: 8px;
    box-shadow: 4px 4px 0 0 #3d2e1e;
    user-select: none;
    background-color: #9a6b3a;
    background-image:
      repeating-linear-gradient(
        92deg,
        rgba(255, 236, 200, 0.08) 0 1px,
        transparent 1px 3px,
        rgba(61, 30, 10, 0.10) 3px 4px,
        transparent 4px 9px
      ),
      repeating-linear-gradient(
        88deg,
        rgba(0, 0, 0, 0.06) 0 2px,
        transparent 2px 14px
      ),
      radial-gradient(ellipse at 30% 20%, rgba(255, 220, 170, 0.18), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(40, 20, 5, 0.22), transparent 65%);
  }
  .row { display: flex; gap: 4px; margin-bottom: 4px; }
  .row:last-child { margin-bottom: 0; }
  .disc-hole {
    width: clamp(44px, 6vw, 64px);
    aspect-ratio: 1;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #6b4a26;
    box-shadow:
      inset 2px 2px 3px rgba(0, 0, 0, 0.55),
      inset -1px -1px 2px rgba(255, 220, 170, 0.12);
  }
  .disc-piece {
    width: 95%;
    height: 95%;
    border-radius: 9999px;
    box-shadow:
      inset -2px -2px 4px rgba(0, 0, 0, 0.35),
      inset 2px 2px 4px rgba(255, 255, 255, 0.25),
      0 1px 2px rgba(0, 0, 0, 0.4);
  }
  .piece-red {
    background: radial-gradient(circle at 30% 30%, #ff8a8a 0%, var(--piece-red) 45%, #8c1e1e 100%);
  }
  .piece-yellow {
    background: radial-gradient(circle at 30% 30%, #ffd78a 0%, var(--piece-yellow) 45%, #7a4006 100%);
  }
  .piece-ghost-red {
    background: radial-gradient(circle at 30% 30%, rgba(255,138,138,0.6) 0%, rgba(217,64,64,0.4) 60%, rgba(140,30,30,0.4) 100%);
  }
</style>
</head>
<body>
<div id="app">
<div class="container">
  <div class="label">US-031 — Connect Four wood board with glossy pieces</div>
  <div class="disc-board">
    <!-- 6 rows x 7 cols; fill a plausible mid-game position -->
    <div class="row">
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"><div class="disc-piece piece-ghost-red"></div></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
    </div>
    <div class="row">
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
    </div>
    <div class="row">
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
    </div>
    <div class="row">
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
    </div>
    <div class="row">
      <div class="disc-hole"></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"></div>
      <div class="disc-hole"></div>
    </div>
    <div class="row">
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-red"></div></div>
      <div class="disc-hole"><div class="disc-piece piece-yellow"></div></div>
    </div>
  </div>
</div>
</div>
</body>
</html>
