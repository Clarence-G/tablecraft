<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US-034 HIVE board separation preview</title>
<style>
  :root {
    --background: #faf5eb;
    --foreground: #3d2e1e;
    --card: #ffffff;
    --border: #c4b8a8;
    --shadow: #1a1108;
    --muted-fg: #6b5744;
    --hand-bg-light: #d6c8af;
  }
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  h2 { margin: 16px 0 8px; font-size: 14px; color: var(--muted-fg); }
  .page { display: flex; flex-direction: column; gap: 24px; }
  .board { background: var(--card); border: 2.5px solid var(--foreground); border-radius: 16px; overflow: hidden; width: 100%; max-width: 520px; box-shadow: 4px 4px 0 0 var(--shadow); padding: 24px; }
  .old { background: rgba(61,46,30,0.05); border: 2px solid rgba(61,46,30,0.4); border-radius: 12px; overflow: hidden; width: 100%; max-width: 520px; box-shadow: 4px 4px 0 0 rgba(26,17,8,0.35); padding: 24px; }
  .panel { background: var(--hand-bg-light); border: 2px solid rgba(61,46,30,0.4); border-radius: 12px; padding: 12px; width: 100%; max-width: 520px; box-shadow: 4px 4px 0 0 rgba(26,17,8,0.4); margin-top: 12px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="page">
  <section>
    <h2>BEFORE (bg-foreground/5, border-2 border-foreground/40, rounded-[12px])</h2>
    <div class="old">
      <svg viewBox="-80 -80 160 160" aria-hidden="true">
        <polygon points="-30,-17.32 0,-34.64 30,-17.32 30,17.32 0,34.64 -30,17.32" fill="#ffffff" stroke="#3d2e1e" stroke-width="1.5" />
        <polygon points="30,-17.32 60,-34.64 90,-17.32 90,17.32 60,34.64 30,17.32" fill="#3d2e1e" stroke="#c4b8a8" stroke-width="1.5" transform="translate(-60, 0)" />
      </svg>
    </div>
  </section>
  <section>
    <h2>AFTER (bg-card, border-thick 2.5px border-foreground, rounded-[16px], shadow hsl(--shadow))</h2>
    <div class="board">
      <svg viewBox="-80 -80 160 160" aria-hidden="true">
        <polygon points="-30,-17.32 0,-34.64 30,-17.32 30,17.32 0,34.64 -30,17.32" fill="#ffffff" stroke="#3d2e1e" stroke-width="1.5" />
        <polygon points="30,-17.32 60,-34.64 90,-17.32 90,17.32 60,34.64 30,17.32" fill="#3d2e1e" stroke="#c4b8a8" stroke-width="1.5" transform="translate(-60, 0)" />
      </svg>
    </div>
    <div class="panel">Inventory panel (unchanged)</div>
  </section>
</div>
</body>
</html>
