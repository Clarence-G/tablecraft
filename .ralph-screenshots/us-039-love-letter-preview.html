<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>US-039 Love Letter Card Animations — preview</title>
    <style>
      :root {
        --background: #faf5eb;
        --foreground: #3d2e1e;
        --card: #ffffff;
        --muted: #f0e8d8;
        --muted-foreground: #6b5744;
        --border: #c4b8a8;
        --shadow: #1a1108;
        --ring: #3d2e1e;
      }
      html, body { margin: 0; padding: 0; background: var(--background); color: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
      #app { padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 900px; margin: 0 auto; }
      h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-foreground); margin: 0; }
      .panel { background: color-mix(in srgb, var(--card) 60%, transparent); border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(61, 46, 30, 0.15); padding: 16px; }
      .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .card {
        width: 80px; height: 112px; border-radius: 12px; background: var(--card);
        border: 2.5px solid var(--foreground);
        box-shadow: -4px 4px 0 0 var(--shadow);
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        padding: 6px 4px; font-size: 11px; text-align: center;
      }
      .card-sm { width: 52px; height: 74px; font-size: 10px; padding: 4px; }
      .value { font-weight: 700; font-size: 16px; }
      .deck-hint { text-align: center; font-size: 11px; color: var(--muted-foreground); margin-bottom: 8px; }
      .deck-visual {
        margin: 0 auto 12px; width: 52px; height: 74px; border-radius: 12px;
        background: repeating-linear-gradient(45deg, #6b4a26 0 6px, #5a3f20 6px 12px);
        border: 2.5px solid var(--foreground); box-shadow: -3px 3px 0 0 var(--shadow);
        position: relative;
      }
      .deck-visual::after { content: attr(data-count); position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
      .caption { font-size: 11px; color: var(--muted-foreground); text-align: center; }

      @keyframes ll-card-play-in {
        from { transform: translateY(-28px) rotate(-8deg); opacity: 0; }
        to   { transform: translateY(0) rotate(0);        opacity: 1; }
      }
      @keyframes ll-card-draw-in {
        from { transform: translateY(-40px) scale(0.92); opacity: 0; }
        to   { transform: translateY(0) scale(1);        opacity: 1; }
      }
      .ll-card-play { display: inline-block; animation: ll-card-play-in 400ms cubic-bezier(0.2, 0.8, 0.3, 1) both; }
      .ll-card-draw { display: inline-block; animation: ll-card-draw-in 350ms cubic-bezier(0.2, 0.8, 0.3, 1) both; }
      @media (prefers-reduced-motion: reduce) {
        .ll-card-play, .ll-card-draw { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div>
        <h2>Play animation — card flies into the discard pile</h2>
        <div class="panel">
          <div class="caption" style="margin-bottom: 8px">Alice's discard pile</div>
          <div class="row">
            <div class="card card-sm"><div class="value">1</div><div>Guard</div></div>
            <div class="card card-sm"><div class="value">3</div><div>Baron</div></div>
            <span class="ll-card-play">
              <div class="card card-sm" style="background: #fff8e5"><div class="value">5</div><div>Prince</div></div>
            </span>
          </div>
        </div>
      </div>

      <div>
        <h2>Draw animation — card slides from deck to hand</h2>
        <div class="panel">
          <div class="deck-hint">Deck remaining: 12 cards</div>
          <div class="deck-visual" data-count="12"></div>
          <div class="caption" style="margin-bottom: 8px">Your hand</div>
          <div class="row">
            <div class="card"><div class="value">2</div><div>Priest</div></div>
            <span class="ll-card-draw">
              <div class="card" style="background: #e5f0ff"><div class="value">8</div><div>Princess</div></div>
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
