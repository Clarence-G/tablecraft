    /* mirror packages/card-ui/src/styles.css */

      position: relative;
      display: inline-flex;
      flex-shrink: 0;
      box-sizing: border-box;
      background: #fcf8f0;
      border: 2px solid #2a1810;
      border-radius: 8px;
      box-shadow: 0 4px 0 #2a1810;
      font-family: "Times New Roman", serif;
      overflow: hidden;
      color: #1a1a1a;
    }
    .card-ui-card.card-ui-face-down { background: #b84a3a; color: #fcf8f0; }
    .card-ui-corner { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 600; }
    .card-ui-corner-tl { top: 6%; left: 8%; }
    .card-ui-corner-br { bottom: 6%; right: 8%; transform: rotate(180deg); }
    .card-ui-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
