<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack card-ui migration preview</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #1f5233;
      color: #fcf8f0;
    }
    .panel {
      background: rgba(252,248,240,0.85);
      color: #2a1810;
      border: 2px solid rgba(252,248,240,0.4);
      border-radius: 12px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    }

    .card-ui-card {
      position: relative;
      display: inline-flex;
      box-sizing: border-box;
      background: #fcf8f0;
      border: 2px solid #2a1810;
      border-radius: 8px;
      box-shadow: 0 4px 0 #2a1810;
      font-family: 'Cinzel', 'Times New Roman', serif;
      overflow: hidden;
      width: 48px;
      height: 68px;
    }
    .card-ui-black { color: #1a1a1a; }
    .card-ui-red { color: #c62828; }
    .card-ui-face-down {
      background: linear-gradient(135deg, #7a1b1b 0%, #5e1212 100%);
      border-color: #2a1810;
    }
    .card-ui-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-weight: 600;
    }
    .card-ui-corner-tl { top: 4px; left: 5px; }
    .card-ui-corner-br { bottom: 4px; right: 5px; transform: rotate(180deg); }
    .card-ui-text { font-size: 10px; }
    .card-ui-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="p-4">

<div id="app" class="max-w-sm mx-auto">
  <h1 class="text-center text-sm uppercase tracking-widest mb-3 opacity-75">Blackjack with @repo/card-ui</h1>

  <!-- Dealer hand -->
  <div class="panel p-4 mb-3">
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs opacity-70 font-medium">Dealer</span>
      <div class="flex gap-1">
        <!-- Ace of spades -->
        <div class="card-ui-card card-ui-black">
          <div class="card-ui-corner card-ui-corner-tl">
            <span class="card-ui-text">A</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C8 7 3 10.5 3 14.5A4.5 4.5 0 0 0 7.5 19c1.1 0 2.1-.4 3-1-.2 1.5-.9 2.8-2.1 4h7.2c-1.2-1.2-1.9-2.5-2.1-4 .9.6 1.9 1 3 1A4.5 4.5 0 0 0 21 14.5C21 10.5 16 7 12 2z"/></svg>
          </div>
          <div class="card-ui-center">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C8 7 3 10.5 3 14.5A4.5 4.5 0 0 0 7.5 19c1.1 0 2.1-.4 3-1-.2 1.5-.9 2.8-2.1 4h7.2c-1.2-1.2-1.9-2.5-2.1-4 .9.6 1.9 1 3 1A4.5 4.5 0 0 0 21 14.5C21 10.5 16 7 12 2z"/></svg>
          </div>
          <div class="card-ui-corner card-ui-corner-br">
            <span class="card-ui-text">A</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C8 7 3 10.5 3 14.5A4.5 4.5 0 0 0 7.5 19c1.1 0 2.1-.4 3-1-.2 1.5-.9 2.8-2.1 4h7.2c-1.2-1.2-1.9-2.5-2.1-4 .9.6 1.9 1 3 1A4.5 4.5 0 0 0 21 14.5C21 10.5 16 7 12 2z"/></svg>
          </div>
        </div>
        <!-- Hidden (CardBack) -->
        <div class="card-ui-card card-ui-face-down"></div>
      </div>
      <span class="text-sm font-semibold">11 points</span>
    </div>
  </div>

  <!-- Player hand -->
  <div class="panel p-4 mb-3" style="border-color:#d4a056; box-shadow: 4px 4px 0 #d4a056;">
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs opacity-70 font-medium">My hand</span>
      <div class="flex gap-1">
        <!-- 10 of hearts -->
        <div class="card-ui-card card-ui-red">
          <div class="card-ui-corner card-ui-corner-tl">
            <span class="card-ui-text">10</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7-4.35-9.5-9.1C.55 8 3 4 6.5 4 8.74 4 10.63 5.35 12 7c1.37-1.65 3.26-3 5.5-3 3.5 0 5.95 4 4 7.9C19 16.65 12 21 12 21z"/></svg>
          </div>
          <div class="card-ui-center">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7-4.35-9.5-9.1C.55 8 3 4 6.5 4 8.74 4 10.63 5.35 12 7c1.37-1.65 3.26-3 5.5-3 3.5 0 5.95 4 4 7.9C19 16.65 12 21 12 21z"/></svg>
          </div>
          <div class="card-ui-corner card-ui-corner-br">
            <span class="card-ui-text">10</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7-4.35-9.5-9.1C.55 8 3 4 6.5 4 8.74 4 10.63 5.35 12 7c1.37-1.65 3.26-3 5.5-3 3.5 0 5.95 4 4 7.9C19 16.65 12 21 12 21z"/></svg>
          </div>
        </div>
        <!-- J of diamonds -->
        <div class="card-ui-card card-ui-red">
          <div class="card-ui-corner card-ui-corner-tl">
            <span class="card-ui-text">J</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 L22 12 L12 22 L2 12 Z"/></svg>
          </div>
          <div class="card-ui-center">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 L22 12 L12 22 L2 12 Z"/></svg>
          </div>
          <div class="card-ui-corner card-ui-corner-br">
            <span class="card-ui-text">J</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 L22 12 L12 22 L2 12 Z"/></svg>
          </div>
        </div>
        <!-- A of clubs -->
        <div class="card-ui-card card-ui-black">
          <div class="card-ui-corner card-ui-corner-tl">
            <span class="card-ui-text">A</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a4 4 0 0 0-3.3 6.26A4 4 0 1 0 8 16.33a4 4 0 0 0 3 1.67c0 1.5-.7 2.9-2 4h6c-1.3-1.1-2-2.5-2-4a4 4 0 0 0 3-1.67 4 4 0 1 0-.7-8.07A4 4 0 0 0 12 2z"/></svg>
          </div>
          <div class="card-ui-center">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a4 4 0 0 0-3.3 6.26A4 4 0 1 0 8 16.33a4 4 0 0 0 3 1.67c0 1.5-.7 2.9-2 4h6c-1.3-1.1-2-2.5-2-4a4 4 0 0 0 3-1.67 4 4 0 1 0-.7-8.07A4 4 0 0 0 12 2z"/></svg>
          </div>
          <div class="card-ui-corner card-ui-corner-br">
            <span class="card-ui-text">A</span>
            <svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a4 4 0 0 0-3.3 6.26A4 4 0 1 0 8 16.33a4 4 0 0 0 3 1.67c0 1.5-.7 2.9-2 4h6c-1.3-1.1-2-2.5-2-4a4 4 0 0 0 3-1.67 4 4 0 1 0-.7-8.07A4 4 0 0 0 12 2z"/></svg>
          </div>
        </div>
      </div>
      <span class="text-sm font-semibold">21 points</span>
      <span class="text-sm font-bold text-emerald-700">Blackjack!</span>
    </div>
  </div>
</div>

</body>
</html>
