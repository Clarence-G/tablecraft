<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>US-036 Liar Bar Revolver Animation — preview</title>
    <style>
      :root {
        --card: 40 33% 96%;
        --foreground: 28 52% 7%;
        --muted: 33 32% 85%;
        --destructive: 0 66% 55%;
        --success: 133 53% 42%;
        --shadow: 28 52% 7%;
        --background: 40 33% 96%;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      #app {
        padding: 24px;
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .panel {
        border: 2.5px solid hsl(var(--foreground));
        background: hsl(var(--card));
        border-radius: 16px;
        box-shadow: 4px 4px 0 0 hsl(var(--shadow));
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        min-width: 200px;
      }
      .caption {
        font-size: 12px;
        font-weight: 700;
        color: hsl(var(--foreground));
      }
      .subcaption {
        font-size: 10px;
        color: hsl(var(--foreground) / 0.6);
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }
      .revolver {
        position: relative;
      }
      .revolver svg {
        animation: spin 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-origin: center;
      }
      .revolver.hit::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: radial-gradient(circle, hsl(var(--destructive)) 0%, transparent 70%);
        opacity: 0.85;
        animation: flash 220ms 600ms both ease-out;
      }
      .revolver.blank::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: radial-gradient(circle, hsl(var(--success)) 0%, transparent 70%);
        opacity: 0.85;
        animation: flash 220ms 600ms both ease-out;
      }
      .hit-label {
        color: hsl(var(--destructive));
        font-weight: 700;
        font-size: 14px;
        opacity: 0;
        animation: fade-in 200ms 820ms forwards;
      }
      .blank-label {
        color: hsl(var(--success));
        font-weight: 700;
        font-size: 14px;
        opacity: 0;
        animation: fade-in 200ms 820ms forwards;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(720deg);
        }
      }
      @keyframes flash {
        from {
          opacity: 0;
        }
        50% {
          opacity: 0.85;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes fade-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
