name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Postgres service container for unit tests. createTestDb() opens a
      # maintenance connection, then CREATE DATABASE test_xxx per test file.
      # The 'postgres' role is a superuser by default in the official image,
      # which implicitly has CREATEDB privilege.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Our code uses this as the maintenance DB (can't drop a DB you're
          # connected to, so tests connect here to CREATE/DROP test_xxx).
          POSTGRES_DB: tablecraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # createTestDb() reads TEST_DATABASE_URL (or DATABASE_URL) to find the
      # Postgres host. Points at the service container above.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tablecraft_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tablecraft_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tablecraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tablecraft_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tablecraft_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
